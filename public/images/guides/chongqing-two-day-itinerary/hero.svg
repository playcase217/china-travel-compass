<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chongqing evening city and river scene</title>
  <desc id="desc">An illustrated evening view of Chongqing with layered hillside buildings, a metro train, river bridges, and a traveler looking toward the skyline.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3154"/>
      <stop offset="0.55" stop-color="#a9514b"/>
      <stop offset="1" stop-color="#f1b46c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#365a76"/>
      <stop offset="1" stop-color="#142d4a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55677a"/>
      <stop offset="1" stop-color="#273847"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d1a29" flood-opacity="0.32"/>
    </filter>
  </defs>

